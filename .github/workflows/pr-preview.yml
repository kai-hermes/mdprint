name: PR preview build

# A reviewer's whole job is easier with a real .vsix in hand instead of
# checking the branch out and building it themselves. This packages one on
# every push to a PR and leaves a comment pointing at it — a pre-release
# build for TESTING, never uploaded anywhere but this workflow run's own
# artifact store, and never attached to an actual GitHub Release (see
# release-please.yml for that).

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - name: Package a pre-release .vsix
        run: npx vsce package --out "mdprint-pr-${{ github.event.pull_request.number }}.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: mdprint-pr-${{ github.event.pull_request.number }}
          path: '*.vsix'
          retention-days: 14
      - name: Comment with the build link
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- mdprint-pr-preview -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `${marker}\n📦 **Preview build ready.** Download the \`.vsix\` from [this workflow run](${runUrl}) (Artifacts section, bottom of the page) and install it via **Extensions → ⋯ → Install from VSIX…**. Rebuilt on every push to this PR.`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
